<!DOCTYPE html>
<html>
<head>
    <title>URL Monitoring Dashboard</title>
</head>
<body>
    <h2>URL Monitoring Dashboard</h2>

    <form method="POST">
        <input type="text" name="url" placeholder="https://example.com" required>
        <button type="submit">Add URL</button>
    </form>

    <table border="1" cellpadding="8">
        <tr>
            <th>ID</th>
            <th>URL</th>
            <th>Status</th>
            <th>Response Time (ms)</th>
        </tr>
        {% for u in urls %}
        <tr>
            <td>{{ u[0] }}</td>
            <td>{{ u[1] }}</td>
            <td>{{ u[2] }}</td>
            <td>{{ u[3] }}</td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
