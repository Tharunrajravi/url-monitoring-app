<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>URL Monitoring Dashboard</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            padding: 30px;
        }
        h1 {
            text-align: center;
        }
        form {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
        }
        input[type="text"] {
            width: 400px;
            padding: 10px;
            font-size: 16px;
        }
        button {
            padding: 10px 16px;
            margin-left: 10px;
            font-size: 16px;
            cursor: pointer;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }
        th, td {
            padding: 12px;
            text-align: center;
            border-bottom: 1px solid #ddd;
        }
        th {
            background: #007bff;
            color: white;
        }
        .UP {
            color: green;
            font-weight: bold;
        }
        .DOWN {
            color: red;
            font-weight: bold;
        }
    </style>
</head>
<body>

<h1>🌐 URL Monitoring Dashboard</h1>

<form method="POST">
    <input type="text" name="url" placeholder="https://example.com" required>
    <button type="submit">Add URL</button>
</form>

<table>
    <tr>
        <th>ID</th>
        <th>URL</th>
        <th>Status</th>
        <th>Response Time (ms)</th>
    </tr>
    {% for u in urls %}
    <tr>
        <td>{{ u[0] }}</td>
        <td>{{ u[1] }}</td>
        <td class="{{ u[2] }}">{{ u[2] }}</td>
        <td>{{ u[3] }}</td>
    </tr>
    {% endfor %}
</table>

</body>
</html>
